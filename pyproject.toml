[project]
name = "xaierp"
version = "1.0.0"
description = "Explainable AI decision support for predictive inventory and procurement optimization in ERP systems (PBL-1)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "lightgbm>=4.5",
    "shap>=0.46",
    "joblib>=1.4",
    "pyarrow>=17.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.1",
    "nbformat>=5.10",
    "nbclient>=0.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --tb=short"
