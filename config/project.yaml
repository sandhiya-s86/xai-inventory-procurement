# ============================================================
# PBL-1 project configuration
# Explainable AI-Driven Decision Support for Predictive
# Inventory and Procurement Optimization in ERP Systems
# ============================================================
# Every tunable number lives here. Nothing is hardcoded in src/.

project:
  name: xai-erp-inventory
  random_seed: 42

paths:
  raw_online_retail: data/raw/online_retail/online_retail_II.xlsx
  interim: data/interim
  processed: data/processed
  simulated: data/simulated
  forecasts: data/forecasts
  results: data/results
  models: models
  reports: reports
  figures: reports/figures
  tables: reports/tables

dataset:
  # UCI Online Retail II -- the two sheets are two trading years.
  sheets:
    - "Year 2009-2010"
    - "Year 2010-2011"
  # Column names exactly as they appear in the workbook.
  columns:
    invoice: Invoice
    stock_code: StockCode
    description: Description
    quantity: Quantity
    invoice_date: InvoiceDate
    price: Price
    customer_id: Customer ID
    country: Country

cleaning:
  # Rows whose Invoice starts with this prefix are cancellations.
  cancellation_prefix: "C"
  # Regex for a genuine product code. Online Retail II mixes real SKUs with
  # service lines (POST, DOT, M, BANK CHARGES, ADJUST, TEST001, ...).
  product_code_regex: "^\\d{5}[A-Za-z]{0,3}$"
  drop_nonpositive_price: true
  # Quantity above this is treated as a data-entry outlier at the LINE level.
  # Chosen from the empirical distribution; see docs/eda_insights.md.
  max_line_quantity: 10000

panel:
  # Dense daily demand panel is built only for the busiest SKUs.
  # Rationale (docs/pbl1_scope.md): a dense panel over all ~4,600 SKUs is
  # mostly structural zeros and would make the forecasting task degenerate.
  top_n_skus: 200
  sku_rank_metric: revenue      # revenue | quantity
  # A SKU must have sold on at least this many distinct days to be modelled.
  min_active_days: 120
  # The retailer does not trade every calendar day. Days with zero invoices
  # across the WHOLE business are "closed" and are excluded, not zero-filled.
  drop_business_closed_days: true

target:
  horizon_days: 7
  regression_target: future_7d_demand

features:
  lags: [1, 7, 14, 28]
  rolling_windows: [7, 14, 28]
  # Longest lookback a feature may use. Rows before this are dropped so that
  # every retained row has fully-observed history (no partial-window leakage).
  min_history_days: 28

split:
  # Chronological, never random. See docs/model_selection.md.
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15

evaluation:
  regression_metrics: [MAE, MSE, RMSE, R2, RMSLE]
  classification_metrics: [accuracy, precision, recall, f1, roc_auc]
  # Stockouts cost more than surplus, so the headline classifier metric is F1,
  # with recall reported alongside.
  classification_primary: f1
  regression_primary: RMSE

polynomial:
  degrees: [1, 2, 3, 4]
  # Degree study uses a compact numeric feature subset so that degree 4 is
  # computationally honest rather than a 100k-column explosion.
  feature_subset:
    - rolling_mean_7
    - rolling_mean_28
    - lag_7
    - rolling_std_7

quantiles:
  levels: [0.50, 0.75, 0.90, 0.95]
  service_level: 0.95
